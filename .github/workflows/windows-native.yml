name: Windows native client

on:
  push:
    branches:
      - feature/windows-native-client
      - dev
    paths:
      - 'desktop/CodexMobile.Windows/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64 app
        shell: pwsh
        run: >-
          dotnet publish desktop/CodexMobile.Windows/CodexMobile.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output out/win-x64
      - name: Package app
        shell: pwsh
        run: Compress-Archive -Path out/win-x64/* -DestinationPath CodexMobile-Windows-x64.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-Windows-x64
          path: CodexMobile-Windows-x64.zip
          retention-days: 30
