name: Windows native client

on:
  push:
    branches:
      - feature/windows-native-client
      - dev
    paths:
      - 'desktop/codex-mobile-rust/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/codex-mobile-rust
          cache-on-failure: 'true'
      - name: Build Windows x64 app
        shell: pwsh
        run: cargo build --release --bins --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Test Windows theme registry
        shell: pwsh
        run: cargo test --release --bin codex-mobile-native --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item desktop/codex-mobile-rust/target/release/codex-mobile-native.exe out/CodexMobile.exe
          Copy-Item desktop/codex-mobile-rust/README.md out/README.md
          Get-Item out/CodexMobile.exe, out/README.md | Select-Object Name, Length
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-Windows-x64
          path: |
            out/CodexMobile.exe
            out/README.md
          retention-days: 30

  visual-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native display build libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri xvfb xdotool imagemagick fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/codex-mobile-rust
          cache-on-failure: 'true'
      - name: Build visual preview on GitHub
        run: cargo build --release --bin ui-preview --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Render dark and light previews
        run: |
          mkdir -p preview
          xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -eu
            export LIBGL_ALWAYS_SOFTWARE=1
            for theme in dark light empty-dark empty-light; do
              desktop/codex-mobile-rust/target/release/ui-preview --$theme >"preview/$theme.log" 2>&1 &
              app_pid=$!
              window_id=""
              for _ in $(seq 1 24); do
                window_id=$(xdotool search --onlyvisible --pid "$app_pid" --name "Codex Mobile" 2>/dev/null | head -n 1 || true)
                if [ -n "$window_id" ]; then break; fi
                sleep 0.5
              done
              if [ -z "$window_id" ] || ! kill -0 "$app_pid" 2>/dev/null; then cat "preview/$theme.log"; exit 1; fi
              sleep 3
              xdotool mousemove --sync 0 0
              import -window "$window_id" "preview/$theme.png"
              kill "$app_pid"
              wait "$app_pid" || true
            done
          '
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-visual-preview
          path: preview/*.png
          retention-days: 7

  web-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture actual web UI
        run: |
          node scripts/mock-server.js > web-reference-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3232/ >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/capture-desktop-reference.mjs
      - name: Upload web reference
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-web-reference
          path: reference/*.png
          retention-days: 7
