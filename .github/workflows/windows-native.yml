name: Windows native client

on:
  push:
    branches:
      - feature/windows-native-client
      - dev
    paths:
      - 'desktop/codex-mobile-rust/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows x64 app
        shell: pwsh
        run: cargo build --release --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item desktop/codex-mobile-rust/target/release/codex-mobile-native.exe out/CodexMobile.exe
          Copy-Item desktop/codex-mobile-rust/README.md out/README.md
          Compress-Archive -Path out/* -DestinationPath CodexMobile-Windows-x64.zip
          Get-Item out/CodexMobile.exe, CodexMobile-Windows-x64.zip | Select-Object Name, Length
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-Windows-x64
          path: CodexMobile-Windows-x64.zip
          retention-days: 30
