name: Windows native client

on:
  push:
    branches:
      - feature/windows-native-client
      - dev
    paths:
      - 'desktop/codex-mobile-rust/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/codex-mobile-rust
          cache-on-failure: 'true'
      - name: Build Windows x64 app
        shell: pwsh
        run: cargo build --release --bins --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Capture native UI previews
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path preview | Out-Null
          foreach ($theme in @('dark', 'light')) {
            $app = Start-Process -FilePath desktop/codex-mobile-rust/target/release/ui-preview.exe -ArgumentList "--$theme" -PassThru
            Start-Sleep -Seconds 4
            if ($app.HasExited) { throw "UI preview exited early in $theme mode" }
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD/preview/$theme.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            Stop-Process -Id $app.Id
          }
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-Windows-preview
          path: preview/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item desktop/codex-mobile-rust/target/release/codex-mobile-native.exe out/CodexMobile.exe
          Copy-Item desktop/codex-mobile-rust/README.md out/README.md
          Compress-Archive -Path out/* -DestinationPath CodexMobile-Windows-x64.zip
          Get-Item out/CodexMobile.exe, CodexMobile-Windows-x64.zip | Select-Object Name, Length
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-Windows-x64
          path: CodexMobile-Windows-x64.zip
          retention-days: 30

  visual-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native display build libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/codex-mobile-rust
          cache-on-failure: 'true'
      - name: Build visual preview on GitHub
        run: cargo build --release --bin ui-preview --manifest-path desktop/codex-mobile-rust/Cargo.toml
      - name: Upload Linux preview executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-visual-preview-linux
          path: desktop/codex-mobile-rust/target/release/ui-preview
          retention-days: 2
