[package]
name = "codex-mobile-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls"] }
futures-util = "0.3"
base64 = "0.22"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
